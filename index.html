<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="theme-color" content="#f6f3ec">
<title>여행 가이드</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#f6f3ec;color:#1d1b18;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
  .wrap{min-height:100%;display:flex;flex-direction:column;justify-content:center;
    padding:calc(env(safe-area-inset-top,0px) + 24px) 24px calc(env(safe-area-inset-bottom,0px) + 24px)}
  h1{margin:0 0 6px;font-size:28px;font-weight:900;letter-spacing:-.02em}
  p{margin:0 0 22px;color:#6f6a60;font-size:15px}
  input[type=password]{width:100%;height:58px;border-radius:16px;border:2px solid #e6e0d4;background:#fff;
    padding:0 16px;font-size:20px;outline:0}
  input[type=password]:focus{border-color:#0f766e}
  label{display:flex;align-items:center;gap:8px;margin:14px 2px 0;font-size:15px;color:#4d4941}
  label input{width:20px;height:20px;accent-color:#0f766e}
  button{width:100%;height:58px;margin-top:18px;border:0;border-radius:16px;background:#e2efec;color:#0d5d56;
    font-size:18px;font-weight:800}
  button:disabled{opacity:.5}
  .err{min-height:22px;margin-top:12px;color:#d2452c;font-size:15px;font-weight:700}
</style>
</head>
<body>
<form class="wrap" id="f" autocomplete="off">
  <h1>여행 가이드</h1>
  <p>비밀번호를 입력해 주세요</p>
  <input type="password" id="pw" placeholder="비밀번호" autocomplete="current-password" enterkeyhint="go">
  <label><input type="checkbox" id="keep" checked> 이 기기에서 기억하기</label>
  <button id="go" type="submit">열기</button>
  <div class="err" id="err"></div>
</form>

n6BLWelsBmvxG7oCbfG0WyiYDd0nqI9ue47/XpEDHm889V7bFjra3dH";
  const ITER = 250000;
  const KEY = 'wh_lock_pw';
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const raw = b64(PAYLOAD);
  const salt = raw.slice(0, 16), iv = raw.slice(16, 28), data = raw.slice(28);

  async function unlock(pw){
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name:'PBKDF2', salt, iterations:ITER, hash:'SHA-256' },
      base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv }, key, data);
    return new TextDecoder().decode(plain);
  }
  function show(html){
    document.open(); document.write(html); document.close();
  }
  const $ = id => document.getElementById(id);
  async function tryOpen(pw, remember){
    $('go').disabled = true; $('go').textContent = '여는 중…'; $('err').textContent = '';
    try{
      const html = await unlock(pw);
      try{ remember ? localStorage.setItem(KEY, pw) : localStorage.removeItem(KEY); }catch(e){}
      show(html);
    }catch(e){
      try{ localStorage.removeItem(KEY); }catch(_){}
      $('err').textContent = (window.crypto && crypto.subtle) ? '비밀번호가 맞지 않아요' : '이 브라우저에서는 열 수 없어요 (https 필요)';
      $('go').disabled = false; $('go').textContent = '열기'; $('pw').select();
    }
  }
  $('f').addEventListener('submit', e => { e.preventDefault(); const v = $('pw').value; if (v) tryOpen(v, $('keep').checked); });
  let saved = null; try{ saved = localStorage.getItem(KEY); }catch(e){}
  if (saved) tryOpen(saved, true);
})();
</script>
